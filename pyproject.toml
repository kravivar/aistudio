[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aistudio"
version = "0.1.0"
description = "Apple Silicon Local Model Hosting for Open WebUI & Open Notebook"
readme = "README.md"
requires-python = "==3.11.*"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "open-webui>=0.5.0",
    "mlx-lm>=0.18.0",
    "mlx-vlm>=0.1.0",
    "mlx-whisper>=0.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "diffusers>=0.27.0",
    "mflux>=0.4.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "imageio-ffmpeg>=0.4.9",
    "huggingface-hub>=0.21.0",
    "pyyaml>=6.0.1",
    "duckduckgo-search>=6.0.0",
    "pywebview>=5.3.0",
    "nuitka>=2.5.0",
]

[project.scripts]
aistudio = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

