# AI Studio Configuration File (config.yml)

# Server Configuration
server:
  host: "0.0.0.0"
  port: 3001
  api_key: "local-sk-key"
  default_model: "mlx-community/Qwen3.6-35B-A3B-4bit"
  output_dir: "~/Documents/aistudio/output"
  log_file: "~/Documents/aistudio/server.log"
  models_dir: "~/Documents/aistudio/models"
  # hf_home: "../mlx_local_llm/models"
  default_models:
    # Image Models
    - id: "RunDiffusion/Juggernaut-XI-v11"
      owned_by: "RunDiffusion"
      type: "image"
      backend: "diffusers"
      size: "1024x1024"
      steps: 8
      guidance: 2.0
      negative_prompt: "blurry, distorted, low quality, text"

    # Video Models
    - id: "dgrauet/ltx-2.3-mlx-q8"
      owned_by: "dgrauet"
      type: "video"
      width: 704
      height: 480
      fps: 24
      duration: 4.0
      steps: 30
      two_stage: true
      seed: -1
      autoplay: true

    - id: "dgrauet/ltx-2.3-mlx-q4"
      owned_by: "dgrauet"
      type: "video"
      width: 704
      height: 480
      fps: 24
      duration: 4.0
      steps: 8
      two_stage: false
      seed: -1
      autoplay: true

    # Large Language Models
    - id: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 65536    
    - id: "mlx-community/Qwen3-Coder-Next-8bit"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 65536
    - id: "mlx-community/Qwen3.6-35B-A3B-4bit"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 65536
      max_tokens: 8192
      temperature: 0.7
      thinking_mode: "stream"
    - id: "mlx-community/Qwen3.6-35B-A3B-8bit"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 65536
    - id: "mlx-community/gemma-4-31b-it-8bit"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 32768
      max_tokens: 8192
      temperature: 0.7
      thinking_mode: "stream"
    - id: "mlx-community/gemma-4-e2b-it-4bit"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 8192
    - id: "mlx-community/gpt-oss-120b-MXFP4-Q8"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 65536
    - id: "mlx-community/gpt-oss-20b-MXFP4-Q8"
      owned_by: "mlx-community"
      type: "llm"
      context_size: 32768

    # Embedding Models
    - id: "sentence-transformers/all-MiniLM-L6-v2"
      owned_by: "sentence-transformers"
      type: "embedding"

# Open WebUI Configuration & Local Database Folder
webui:
  port: 3000
  data_dir: "~/Documents/aistudio/data/webui"
  auth: false
  enable_signup: false
  enable_ollama_api: false
  name: "AI Studio"
  admin_email: "admin@aistudio.local"
  admin_password: "adminpassword123"
  secret_key: "ai-studio-secret"
  telemetry: false
  do_not_track: true
  scarf_no_analytics: true
  enable_community_sharing: false
  show_admin_details: false
  stream_response: true

# SearXNG Web Search Integration (Hosted via local /v1/search API endpoint)
web_search:
  enable: true
  engine: "searxng"
  query_url: "http://localhost:3001/v1/search?q=<query>"

# Document RAG & PDF OCR Image Extraction
document_rag:
  pdf_extract_images: true
  enable_ocr_text_extraction: true
  content_extraction_engine: ""

